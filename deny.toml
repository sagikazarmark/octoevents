[graph]
all-features = true

[advisories]
# RUSTSEC-2023-0071 is the Marvin timing sidechannel in the rsa crate, with no
# fixed release available. It is reached only by RSA *private key* operations,
# which happen in octocrab's GitHub App JWT signing. octoevents uses octocrab
# for `models::webhook_events` and nothing else -- it never builds a client,
# never authenticates, and never signs. The alternative backends put a C
# toolchain (ring or aws-lc-sys) back in the tree and break the wasm build, so
# tests and examples select RustCrypto through a dev-dependency; consumers
# choose their own backend. Revisit when RustCrypto lands constant-time RSA.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
# The derive crate's doctest depends on `octoevents` by path alone, with no
# version: a dev-dependency cargo strips on publish, so it is never a wildcard
# on crates.io. Path dependencies are the one wildcard this allows.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
