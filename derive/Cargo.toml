[package]
name = "octoevents-derive"
version.workspace = true
description = "Derive macros for octoevents."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["github", "webhook"]
categories = ["web-programming"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "2.0.106", default-features = false, features = [
  "clone-impls",
  "derive",
  "parsing",
  "printing",
  "proc-macro",
] }

# For the doctest on the derive, which expands to `impl octoevents::Payload`.
# A dev-dependency may point back at the crate that depends on this one.
[dev-dependencies]
octoevents = { path = "..", default-features = false, features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }

[lints]
workspace = true
