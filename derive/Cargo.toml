[package]
name = "octoevents-derive"
version.workspace = true
description = "Derive macros for octoevents."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/octoevents-derive"
readme = "../README.md"
keywords = ["github", "webhook"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "3.0.4", default-features = false, features = [
  "clone-impls",
  "derive",
  # `#[payload(..)]` accepts any expression valid in an associated constant.
  "full",
  "parsing",
  "printing",
  "proc-macro",
] }

# Consumer tests and executable examples live in octoevents, keeping the
# dependency graph one-way so this crate can be published first.

[lints]
workspace = true
