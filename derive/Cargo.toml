[package]
name = "octoevents-derive"
version.workspace = true
description = "Derive macros for octoevents."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/octoevents-derive"
readme = "../README.md"
keywords = ["github", "webhook"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "3.0.4", default-features = false, features = [
  "clone-impls",
  "derive",
  # `#[payload(..)]` accepts any expression valid in an associated constant.
  "full",
  "parsing",
  "printing",
  "proc-macro",
] }

# For the tests of the derive, which expands to `impl octoevents::Payload`.
# A dev-dependency may point back at the crate that depends on this one.
# Keep the lockstep version so Cargo retains it in the published manifest.
[dev-dependencies]
octoevents = { version = "=0.1.0", path = "..", default-features = false, features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }

[lints]
workspace = true
