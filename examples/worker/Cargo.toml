[package]
name = "octoevents-worker-example"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
octoevents = { path = "../..", default-features = false, features = ["http"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.20"
worker = { version = "0.8.5", features = ["http"] }
