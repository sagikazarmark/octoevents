[workspace]
members = ["derive"]
default-members = [".", "derive"]
# A standalone crate with its own lockfile and a `cdylib` target, built for
# wasm32 on its own; not a member.
exclude = ["examples/worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/octoevents"

[package]
name = "octoevents"
version.workspace = true
description = "Receive and verify GitHub webhook events"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/octoevents"
keywords = ["github", "webhook", "tower", "cloudflare", "wasm"]
categories = ["web-programming", "cryptography"]
# What the published crate ships: the sources, the examples, the tests with
# their fixture corpus, the README and the licences. The design docs, the
# glossary, the CI and the devenv/dagger files stay in the repository, and so
# does `examples/worker`, a package of its own that cargo leaves out on its
# own account.
include = [
  "/src/**",
  "/examples/**",
  "/tests/**",
  "/README.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]

[features]
default = ["http-body", "derive"]
derive = ["dep:octoevents-derive"]
http-body = ["dep:http-body", "dep:http-body-util"]
octocrab = ["dep:octocrab"]
tower = ["http-body", "dep:tower-service"]
tracing = ["dep:tracing"]

[dependencies]
base64 = "0.23.1"
bytes = "1.10.1"
hmac = "0.13.0"
http = "1.3.1"
http-body = { version = "1.0.1", optional = true }
http-body-util = { version = "0.1.3", optional = true }
octocrab = { version = "0.54.1", default-features = false, features = [
  "jwt-rust-crypto",
], optional = true }
# The derive expands to `impl octoevents::Payload`, so the two crates move in
# lockstep: pinned exactly, released together.
octoevents-derive = { version = "=0.1.0", path = "derive", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["raw_value"] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.16"
tower-service = { version = "0.3.3", optional = true }
tracing = { version = "0.1.41", optional = true }
zeroize = "1.8.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow = "1.0.104"
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5.2", features = ["util"] }
tracing-subscriber = { version = "0.3.20", features = ["registry"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The examples, in the order to read them: the README's quickstart, a receiver
# with no dispatcher, a dispatcher with every tier, and the policy seam around
# one. Each carries `#[cfg(test)]` tests; `test = true` includes them in the
# default `cargo test` selection whenever their required features are enabled.
# `cargo test --all-features` runs all of them. The Cloudflare
# Worker example is a package of its own under
# `examples/worker`, excluded from the workspace above.
[[example]]
name = "quickstart"
test = true
required-features = ["tower"]

[[example]]
name = "axum"
test = true
required-features = ["tower"]

[[example]]
name = "dispatcher"
test = true
required-features = ["tower", "derive"]

[[example]]
name = "policy_seam"
test = true
required-features = ["tower", "octocrab"]

[lints]
workspace = true

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Line tables keep file and line in panics and backtraces, which is all a test
# failure needs; variable and type debuginfo is only for a debugger and is most
# of what the linker copies on every incremental test build, so dropping it
# shortens the edit-to-green cycle and shrinks the test binaries. For a
# debugger session, override for one build:
# `CARGO_PROFILE_DEV_DEBUG=2 cargo test ...`.
[profile.dev]
debug = "line-tables-only"

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"

# Dagger's upstream Rust module forwards these arguments before the subcommand
# to cargo-hack. Cargo target flags belong on Dagger's API calls (justfile),
# not here: cargo-hack preserves their position relative to the subcommand.
# Each-feature includes no features, defaults, all features, and each feature
# alone. Check the powerset too, to catch interactions between optional features.
[[workspace.metadata.dagger.modules]]
name = "rust"
hack.check = ["--workspace", "--feature-powerset", "--locked"]
hack.test = ["--workspace", "--each-feature", "--locked"]
hack.clippy = ["--workspace", "--each-feature", "--locked"]
hack.doc = ["--workspace", "--each-feature", "--locked"]
